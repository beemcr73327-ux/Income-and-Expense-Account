<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกรายรับ-รายจ่าย & ออมลงทุนส่วนตัว</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome / Lucide icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="app-logo">
                    <i data-lucide="wallet"></i>
                </div>
                <div>
                    <h1 class="app-title">Finance Tracker</h1>
                    <p class="app-subtitle">สมุดบัญชีรายรับ-รายจ่าย 2026</p>
                </div>
            </div>
            <div class="header-right">
                <div id="connection-badge" class="badge badge-warning" title="Google Sheets connection status">
                    <span class="dot"></span> <span id="conn-text">Mock Mode</span>
                </div>
            </div>
        </header>

        <!-- Main Content Viewport -->
        <main id="main-content" class="content-viewport">

            <!-- PAGE 1: DASHBOARD -->
            <section id="page-dashboard" class="page-view active">
                <!-- KPI Cards Grid -->
                <div class="kpi-grid">
                    <div class="kpi-card card-income">
                        <div class="kpi-icon"><i data-lucide="trending-up"></i></div>
                        <div class="kpi-info">
                            <span class="kpi-label">รายรับเดือนนี้</span>
                            <h3 class="kpi-value" id="kpi-income">฿0</h3>
                        </div>
                    </div>
                    <div class="kpi-card card-expense">
                        <div class="kpi-icon"><i data-lucide="trending-down"></i></div>
                        <div class="kpi-info">
                            <span class="kpi-label">รายจ่ายเดือนนี้</span>
                            <h3 class="kpi-value" id="kpi-expense">฿0</h3>
                        </div>
                    </div>
                    <div class="kpi-card card-saving">
                        <div class="kpi-icon"><i data-lucide="piggy-bank"></i></div>
                        <div class="kpi-info">
                            <span class="kpi-label">ออม+ลงทุนเดือนนี้</span>
                            <h3 class="kpi-value" id="kpi-saving">฿0</h3>
                        </div>
                    </div>
                    <div class="kpi-card card-balance">
                        <div class="kpi-icon"><i data-lucide="coins"></i></div>
                        <div class="kpi-info">
                            <span class="kpi-label">คงเหลือ (รายรับ-รายจ่าย)</span>
                            <h3 class="kpi-value" id="kpi-balance">฿0</h3>
                        </div>
                    </div>
                </div>

                <!-- Chart Section -->
                <div class="glass-card chart-card">
                    <div class="card-header">
                        <h2 class="card-title"><i data-lucide="pie-chart"></i> สัดส่วนค่าใช้จ่าย</h2>
                        <!-- View Toggle -->
                        <div class="segmented-control toggle-view">
                            <button class="segmented-btn active" data-view="year">ทั้งปี</button>
                            <button class="segmented-btn" data-view="month">รายเดือน</button>
                            <button class="segmented-btn" data-view="day">รายวัน</button>
                        </div>
                    </div>

                    <!-- Filter Controls (Dynamic based on view toggle) -->
                    <div class="chart-filters" id="chart-filters">
                        <div class="filter-group" id="month-filter-group" style="display: none;">
                            <label for="month-select"><i data-lucide="calendar"></i> เลือกเดือน:</label>
                            <select id="month-select" class="form-select">
                                <option value="1">มกราคม</option>
                                <option value="2">กุมภาพันธ์</option>
                                <option value="3">มีนาคม</option>
                                <option value="4">เมษายน</option>
                                <option value="5">พฤษภาคม</option>
                                <option value="6" selected>มิถุนายน</option>
                                <option value="7">กรกฎาคม</option>
                                <option value="8">สิงหาคม</option>
                                <option value="9">กันยายน</option>
                                <option value="10">ตุลาคม</option>
                                <option value="11">พฤศจิกายน</option>
                                <option value="12">ธันวาคม</option>
                            </select>
                        </div>
                        <div class="filter-group" id="day-filter-group" style="display: none;">
                            <label for="day-picker"><i data-lucide="calendar"></i> เลือกวันที่:</label>
                            <input type="date" id="day-picker" class="form-input">
                        </div>
                    </div>

                    <!-- Donut Chart Container -->
                    <div class="chart-container">
                        <canvas id="expenseChart"></canvas>
                        <div id="chart-center-text" class="chart-center-text">
                            <span class="center-label">รวมค่าใช้จ่าย</span>
                            <span class="center-value" id="chart-total-val">฿0</span>
                        </div>
                    </div>
                </div>

                <!-- Actual vs Budget Comparison Section -->
                <div class="glass-card budget-section" id="budget-section">
                    <div class="card-header">
                        <h2 class="card-title"><i data-lucide="target"></i> เปรียบเทียบ งบประมาณ (Actual vs Budget)</h2>
                    </div>
                    <div class="budget-list" id="budget-progress-list">
                        <!-- Progress bars rendered via JS -->
                    </div>
                </div>
            </section>


            <!-- PAGE 2: ADD TRANSACTION -->
            <section id="page-add" class="page-view">
                <div class="glass-card form-card">
                    <h2 class="form-title"><i data-lucide="plus-circle"></i> บันทึกรายการใหม่</h2>

                    <!-- Transaction Type Tabs -->
                    <div class="type-tabs">
                        <button class="type-tab active tab-expense" data-type="expense">
                            <i data-lucide="arrow-down-right"></i> ค่าใช้จ่าย
                        </button>
                        <button class="type-tab tab-income" data-type="income">
                            <i data-lucide="arrow-up-right"></i> รายรับ
                        </button>
                        <button class="type-tab tab-saving" data-type="saving">
                            <i data-lucide="piggy-bank"></i> ออม+ลงทุน
                        </button>
                    </div>

                    <form id="tx-form">
                        <input type="hidden" id="tx-type" value="expense">

                        <div class="form-field">
                            <label for="tx-date"><i data-lucide="calendar"></i> วันที่ทำรายการ</label>
                            <input type="date" id="tx-date" class="form-input" required>
                        </div>

                        <div class="form-field">
                            <label for="tx-name"><i data-lucide="tag"></i> ชื่อรายการ / หมวดหมู่</label>
                            <div id="tx-name-container">
                                <!-- Rendered dynamically based on type (Dropdown or Text input) -->
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="tx-amount"><i data-lucide="dollar-sign"></i> จำนวนเงิน (บาท)</label>
                            <input type="number" id="tx-amount" class="form-input" placeholder="0.00" step="0.01" min="0" inputmode="decimal" required>
                        </div>

                        <!-- Specific fields for Saving + Investment -->
                        <div id="saving-fields" style="display: none;">
                            <div class="form-field">
                                <label for="tx-saving-type"><i data-lucide="layers"></i> ประเภทรายการออม</label>
                                <select id="tx-saving-type" class="form-select">
                                    <option value="ออม">ออม</option>
                                    <option value="ซื้อ">ซื้อ</option>
                                    <option value="ขาย">ขาย</option>
                                    <option value="Spend">Spend</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label for="tx-saving-group"><i data-lucide="folder"></i> กลุ่มสินทรัพย์ / เป้าหมาย</label>
                                <select id="tx-saving-group" class="form-select">
                                    <option value="Saving">Saving</option>
                                    <option value="Self invesment">Self invesment</option>
                                    <option value="เจ็บป่วย">เจ็บป่วย</option>
                                    <option value="Cash Invesment">Cash Invesment</option>
                                    <option value="หุ้น">หุ้น</option>
                                    <option value="ETF">ETF</option>
                                    <option value="Crypto">Crypto</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="tx-note"><i data-lucide="file-text"></i> รายละเอียดเพิ่มเติม / หมายเหตุ</label>
                            <input type="text" id="tx-note" class="form-input" placeholder="ข้อความเพิ่มเติม (ไม่บังคับ)">
                        </div>

                        <button type="submit" class="btn btn-primary btn-block" id="btn-save-tx">
                            <i data-lucide="save"></i> บันทึกข้อมูลลง Google Sheets
                        </button>
                    </form>
                </div>
            </section>


            <!-- PAGE 3: TRANSACTION LIST -->
            <section id="page-history" class="page-view">
                <div class="glass-card">
                    <div class="card-header">
                        <h2 class="card-title"><i data-lucide="history"></i> ประวัติรายการบันทึก</h2>
                    </div>
                    
                    <div class="history-controls">
                        <div class="segmented-control history-tabs">
                            <button class="segmented-btn active" data-filter="all">ทั้งหมด</button>
                            <button class="segmented-btn" data-filter="expense">ค่าใช้จ่าย</button>
                            <button class="segmented-btn" data-filter="income">รายรับ</button>
                            <button class="segmented-btn" data-filter="saving">ออม/ลงทุน</button>
                        </div>
                    </div>

                    <div id="history-list" class="transaction-list">
                        <!-- Transaction rows injected by JS -->
                    </div>
                </div>
            </section>


        <!-- Bottom Navigation Bar (Fixed Horizontal Flex) -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-page="page-dashboard">
                <i data-lucide="layout-dashboard"></i>
                <span>หน้าหลัก</span>
            </button>
            <button class="nav-item" data-page="page-add">
                <i data-lucide="plus-circle"></i>
                <span>บันทึก</span>
            </button>
            <button class="nav-item" data-page="page-history">
                <i data-lucide="list"></i>
                <span>รายการ</span>
            </button>
        </nav>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="/app.js"></script>
</body>
</html>
